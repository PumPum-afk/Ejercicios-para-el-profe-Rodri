<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - JokeAPI</title>
    <link rel="stylesheet" href="ej13.css">
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <span class="eyebrow">Casino de Risas</span>
            <h2>Apuesta por tu próximo chiste</h2>
            <p>Elige tu categoría y tipo para descubrir el premio del humor.</p>
        </div>
    </header>
    <div class="nashe">
        <h1>Generador de Chistes</h1>
        <div class="controles">
            <label for="categoria">Categoría:</label>
            <select id="categoria">
                <option value="Any">Any</option>
                <option value="Programming">Programming</option>
                <option value="Misc">Misc</option>
                <option value="Pun">Pun</option>
                <option value="Spooky">Spooky</option>
                <option value="Christmas">Christmas</option>
            </select>
            <label for="tipo">Tipo:</label>
            <select id="tipo">
                <option value="single">single</option>
                <option value="twopart">twopart</option>
            </select>
        </div>
        <button id="btnChiste">Traer chiste</button>
        <div id="Chiste" class="chiste"></div>
    </div>
    <script src="ej13.js"></script>
</body>
</html>
